name: "Lock Threads"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock

jobs:
  action:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@b2726a6ae6f1e1b06eb0ff28f7e4fb5e4246bbca # v6.0.2
        with:
          issue-inactive-days: "90"
          pr-inactive-days: "90"
          process-only: "issues, prs"
