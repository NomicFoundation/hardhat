name: Setup env
description: Sets up node and pnpm

inputs:
  node-version:
    description: Version of node to install
    required: false
    default: "24"
  check-latest:
    description: Whether to ignore the runner's cached node and always install the latest release matching node-version
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - id: setup-node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        check-latest: ${{ inputs.check-latest }}
        registry-url: https://registry.npmjs.org
    # Needed for node-hid, which is used by @ledgerhq/hw-transport-node-hid
    # We need to install it because downloading the prebuilt binaries is not
    # reliable, so the CI sometimes falls back to building it from source,
    # which needs this package.
    #
    # `time` is GNU /usr/bin/time: bench:regression and the benchmark runner
    # tests measure peak RSS with it.
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev libudev-dev time
