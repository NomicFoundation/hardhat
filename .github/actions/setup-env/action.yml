name: Setup env
description: Sets up node and pnpm

inputs:
  node-version:
    description: Version of node to install
    required: false
    default: "24"
  cache-save:
    description: Whether to save the pnpm cache
    required: false
    default: "false"
  check-latest:
    description: Whether to ignore the runner's cached node and always install the latest release matching node-version
    required: false
    default: "false"
outputs:
  cache-hit:
    description: Whether the cache was restored
    value: ${{ steps.setup-node.outputs.cache-hit || steps.cache-restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - id: setup-node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        check-latest: ${{ inputs.check-latest }}
        cache: ${{ inputs.cache-save == 'true' && 'pnpm' || '' }}
        cache-dependency-path: "**/pnpm-lock.yaml"
        registry-url: https://registry.npmjs.org
    - id: pnpm
      if: inputs.cache-save == 'false'
      run: pnpm store path --silent | xargs -I {} -0 echo "path={}" | tee -a $GITHUB_OUTPUT
      shell: bash
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-restore
      if: inputs.cache-save == 'false'
      with:
        path: ${{ steps.pnpm.outputs.path }}
        key: node-cache-${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
    # node-hid (via @ledgerhq/device-transport-kit-node-hid): its Linux prebuilt
    # binary links libusb-1.0 at runtime; a node-gyp fallback build needs both.
    #
    # `time` is GNU /usr/bin/time: bench:regression and the benchmark runner
    # tests measure peak RSS with it.
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev libudev-dev time
