name: Setup env
description: Sets up node and pnpm

inputs:
  pnpm-version:
    description: Version of pnpm to install
    required: false
    default: "11.6.0"
  node-version:
    description: Version of node to install
    required: false
    default: "24"
  cache-save:
    description: Whether to save the pnpm cache
    required: false
    default: "false"
outputs:
  cache-hit:
    description: Whether the cache was restored
    value: ${{ steps.setup-node.outputs.cache-hit || steps.cache-restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      with:
        version: ${{ inputs.pnpm-version }}
    - id: setup-node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache-save == 'true' && 'pnpm' || '' }}
        cache-dependency-path: "**/pnpm-lock.yaml"
        registry-url: https://registry.npmjs.org
    - id: pnpm
      if: inputs.cache-save == 'false'
      run: pnpm store path --silent | xargs -I {} -0 echo "path={}" | tee -a $GITHUB_OUTPUT
      shell: bash
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-restore
      if: inputs.cache-save == 'false'
      with:
        path: ${{ steps.pnpm.outputs.path }}
        key: node-cache-${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
    # Needed for node-hid, which is used by @ledgerhq/hw-transport-node-hid
    # We need to install it because downloading the prebuilt binaries is not
    # reliable, so the CI sometimes falls back to building it from source,
    # which needs this package.
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libusb-1.0-0-dev libudev-dev
