packages:
  - "packages/*"
  - "packages/hardhat/templates/*"

allowBuilds:
  node-hid: true
  esbuild: false
  keccak: false
  unrs-resolver: false
  usb: false

hoistPattern:
  - "!@types/*"

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - hardhat
  - "@nomicfoundation/*"
  # Renovate security update: undici@7.29.1
  - undici@7.29.1
