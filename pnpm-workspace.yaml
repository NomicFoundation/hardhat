packages:
  - "packages/*"
  - "packages/hardhat/templates/*"

allowBuilds:
  node-hid: true
  esbuild: false
  keccak: false
  unrs-resolver: false
  usb: false

hoistPattern:
  - "!@types/*"

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - hardhat
  - "@nomicfoundation/*"
  # Renovate security update: zod@4.6.6
  - zod@4.6.6
